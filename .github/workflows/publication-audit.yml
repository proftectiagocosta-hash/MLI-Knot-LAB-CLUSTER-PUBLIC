name: Public publication audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-audit:
    name: publication-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run public sanitization audit
        shell: pwsh
        run: ./tools/audit_publication.ps1
